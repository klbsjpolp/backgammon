name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: ${{ matrix.node-version == '22.x' && 'pnpm test:coverage' || 'pnpm test' }}

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
