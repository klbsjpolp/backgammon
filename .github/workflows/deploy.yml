name: Deploy

# Cuts a semver release from the conventional commits on main (version bump,
# CHANGELOG, tag), then builds the web app from that release commit and deploys
# it to GitHub Pages, publishing the released tag in runtime-config.json so tabs
# already open can update themselves. Online play connects to the shared
# realtime-infra server via the VITE_BACKGAMMON_API_URL secret (point it at the
# same server skip-bo uses).

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      minimum_supported_version:
        description: 'Oldest release tag still allowed to run (e.g. v1.4.0); blank leaves updates optional'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    # workflow_run fires on *completion*, pass or fail, so the conclusion has to
    # be checked here or a red CI still cuts a release and deploys it. The
    # release commit carries [skip ci], so it never re-runs CI and never
    # re-enters this workflow; the actor guard covers a manual re-run on top of
    # one, and workflow_dispatch bypasses both (there is no triggering run).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release_meta.outputs.release_sha }}
      release_tag: ${{ steps.release_meta.outputs.release_tag }}
      release_version: ${{ steps.release_meta.outputs.release_version }}
    steps:
      # Checkout would happily clone this public repo with an empty token and
      # only fail four steps later, mid-release. Refuse up front instead.
      - name: Require a release push token
        shell: bash
        env:
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          if [ -z "$RELEASE_PUSH_TOKEN" ]; then
            echo "::error::RELEASE_PUSH_TOKEN is not set. The release pushes a commit and a tag to main, which the branch ruleset denies to GITHUB_TOKEN; set a PAT with contents:write that is allowed to bypass the ruleset."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # Full history is required for conventional-commit version calculation
          # main is protected by a ruleset, which GITHUB_TOKEN cannot satisfy, so
          # the PAT is required rather than preferred. Falling back to
          # github.token here only moved the failure to the push, after the tag
          # had already been cut.
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}
      - uses: ./.github/actions/setup-node

      - name: Configure git author
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Recovery for the release that already half-applied. A declined branch
      # push left its tag behind (--atomic stops that happening again, but not
      # the one already published), and commit-and-tag-version recomputes that
      # same version on every subsequent run and dies on "tag already exists" —
      # so the pipeline cannot heal without this. A tag for the version about to
      # be cut whose commit is not reachable from main can only be that debris:
      # a tag from a release that landed is by definition on main. Anything
      # reachable is a real tag and stops the job instead of being touched.
      - name: Drop a stale tag from a declined release push
        shell: bash
        run: |
          next=$(pnpm release:dry-run | sed -n 's/.*tagging release \(v[0-9][^ ]*\).*/\1/p' | tail -1)
          if [ -z "$next" ]; then
            echo "::error::Could not read the next release tag out of a dry run."
            exit 1
          fi
          echo "Next release tag: $next"
          if ! git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "No $next tag yet; nothing to clean up."
            exit 0
          fi
          if git merge-base --is-ancestor "$next^{commit}" HEAD; then
            echo "::error::$next already exists and its commit is on main, so this is a real release tag, not debris. Refusing to touch it."
            exit 1
          fi
          echo "::warning::$next exists but its commit is not on main - debris from a release whose branch push was declined. Deleting it and re-cutting."
          git push origin ":refs/tags/$next"
          git tag -d "$next"

      - name: Create release commit and tag
        shell: bash
        run: pnpm release -- --no-verify

      # --atomic is load-bearing: without it the tag and the branch are separate
      # ref updates, so a ruleset that declines the branch still publishes the
      # tag. That orphan tag then makes every later run die on "tag already
      # exists", because the version it recomputes is the one already tagged.
      - name: Push release commit and tag
        shell: bash
        run: git push --atomic --follow-tags origin HEAD:main

      - name: Capture release metadata
        id: release_meta
        shell: bash
        run: |
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "release_tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
          echo "release_version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.release_sha }}
      - uses: ./.github/actions/setup-node
      - uses: actions/configure-pages@v6

      # Read by the running app to notice it is out of date. It ships next to
      # the bundle instead of inside it, so an open tab can poll for the version
      # the deploy is serving. Leave MINIMUM_SUPPORTED_VERSION unset for optional
      # updates; set it to a tag to force older clients to reload.
      - name: Generate runtime config
        shell: bash
        env:
          APP_VERSION: ${{ needs.release.outputs.release_tag }}
          MINIMUM_SUPPORTED_VERSION: ${{ inputs.minimum_supported_version || vars.MINIMUM_SUPPORTED_VERSION }}
        run: |
          node <<'EOF'
          const fs = require('node:fs');

          const payload = {
            appVersion: process.env.APP_VERSION ?? '',
            minimumSupportedVersion: process.env.MINIMUM_SUPPORTED_VERSION ?? '',
          };

          fs.writeFileSync('apps/web/public/runtime-config.json', `${JSON.stringify(payload, null, 2)}\n`);
          EOF

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          VITE_APP_VERSION: ${{ needs.release.outputs.release_tag }}
          VITE_BACKGAMMON_API_URL: ${{ secrets.VITE_BACKGAMMON_API_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  github-release:
    needs: [release, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.release_tag }}
          name: ${{ needs.release.outputs.release_tag }}
          generate_release_notes: true
