name: Deploy

# Builds the web app and deploys it to GitHub Pages. Online play connects to the
# shared realtime-infra server via the VITE_BACKGAMMON_API_URL secret (point it
# at the same server skip-bo uses).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: actions/configure-pages@v6

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          VITE_BACKGAMMON_API_URL: ${{ secrets.VITE_BACKGAMMON_API_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
