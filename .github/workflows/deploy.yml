name: Deploy

# Cuts a semver release from the conventional commits on main (version bump,
# CHANGELOG, tag), then builds the web app from that release commit and deploys
# it to GitHub Pages, publishing the released tag in runtime-config.json so tabs
# already open can update themselves. Online play connects to the shared
# realtime-infra server via the VITE_BACKGAMMON_API_URL secret (point it at the
# same server skip-bo uses).

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      minimum_supported_version:
        description: 'Oldest release tag still allowed to run (e.g. v1.4.0); blank leaves updates optional'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    # The release commit carries [skip ci], so it does not re-trigger this
    # workflow; the actor guard covers a manual re-run on top of one.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release_meta.outputs.release_sha }}
      release_tag: ${{ steps.release_meta.outputs.release_tag }}
      release_version: ${{ steps.release_meta.outputs.release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # Full history is required for conventional-commit version calculation
          # A PAT lets the release push trigger downstream workflows and pass
          # branch protection; the default token is enough without one.
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}
      - uses: ./.github/actions/setup-node

      - name: Configure git author
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release commit and tag
        shell: bash
        run: pnpm release -- --no-verify

      - name: Push release commit and tag
        shell: bash
        run: git push --follow-tags origin HEAD:main

      - name: Capture release metadata
        id: release_meta
        shell: bash
        run: |
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "release_tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
          echo "release_version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.release_sha }}
      - uses: ./.github/actions/setup-node
      - uses: actions/configure-pages@v6

      # Read by the running app to notice it is out of date. It ships next to
      # the bundle instead of inside it, so an open tab can poll for the version
      # the deploy is serving. Leave MINIMUM_SUPPORTED_VERSION unset for optional
      # updates; set it to a tag to force older clients to reload.
      - name: Generate runtime config
        shell: bash
        env:
          APP_VERSION: ${{ needs.release.outputs.release_tag }}
          MINIMUM_SUPPORTED_VERSION: ${{ inputs.minimum_supported_version || vars.MINIMUM_SUPPORTED_VERSION }}
        run: |
          node <<'EOF'
          const fs = require('node:fs');

          const payload = {
            appVersion: process.env.APP_VERSION ?? '',
            minimumSupportedVersion: process.env.MINIMUM_SUPPORTED_VERSION ?? '',
          };

          fs.writeFileSync('apps/web/public/runtime-config.json', `${JSON.stringify(payload, null, 2)}\n`);
          EOF

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          VITE_APP_VERSION: ${{ needs.release.outputs.release_tag }}
          VITE_BACKGAMMON_API_URL: ${{ secrets.VITE_BACKGAMMON_API_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  github-release:
    needs: [release, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.release_tag }}
          name: ${{ needs.release.outputs.release_tag }}
          generate_release_notes: true
