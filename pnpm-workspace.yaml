packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild

overrides:
  esbuild: 0.27.7

# These groups only work on one shared release: vitest and typescript-eslint
# name their sibling packages as exact-version peers or dependencies. Dependabot
# can bump one member alone and pnpm merely warns, so each group is declared
# once here, pinned exactly (a caret lets a fresh resolve move one member past
# the others). CI fails on any unmet peer with `pnpm peers check`, and
# .github/scripts/align-catalog.mjs, which lists the groups, moves the rest of a
# group when Dependabot bumps one member alone, as it does every time.
catalog:
  vitest: 5.0.5
  '@vitest/coverage-v8': 5.0.5
  typescript-eslint: 8.72.0
  '@typescript-eslint/eslint-plugin': 8.72.0
  '@typescript-eslint/parser': 8.72.0
