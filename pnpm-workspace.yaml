packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild

overrides:
  esbuild: 0.27.7

# These groups only work on one shared release: vitest and typescript-eslint
# name their sibling packages as exact-version peers or dependencies. Dependabot
# can bump one member alone and pnpm merely warns, so each group is declared
# once here, pinned exactly (a caret lets a fresh resolve move one member past
# the others). CI fails on any unmet peer with `pnpm peers check`.
catalog:
  vitest: 4.1.11
  '@vitest/coverage-v8': 4.1.11
  typescript-eslint: 8.70.0
  '@typescript-eslint/eslint-plugin': 8.70.0
  '@typescript-eslint/parser': 8.70.0
